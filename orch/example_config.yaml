# Orch config — one managed team in a single file.
# Paths are relative to this file; ~ and $VARS are expanded.
# For a project folder (.orch/settings.yaml + .orch/agents/*/agent.yaml), run: orch init . --project

output_dir: ./orch-runs

models:
  opus:
    backend: claude
    backend_options:
      model: opus
      effort: medium
      permission_mode: auto
  codex-sol:
    backend: codex
    backend_options:
      model: gpt-6.2-sol
      effort: medium
  sonnet:
    backend: claude
    backend_options:
      model: sonnet
      effort: medium
      permission_mode: auto
  qwen-max:
    backend: opencode
    backend_options:
      model: alibaba-token-plan-cn/qwen4-max-preview

retry_waits: [60, 120, 240]
fallback_cooldown: 18000

monitors:
  - name: api-feature
    workspace: ..
    working_dir: .
    max_rounds: 400
    goal: |
      Add a GET /health endpoint that returns {"status": "ok"} with tests,
      and document it in README.md.

    controller:
      mode: managed
      approve_plan: true
      approve_milestones: true
      # min_score: 4
      # golden_board: ./golden.md
      # golden_limit: 8000

    agents:
      - name: manager
        role: manager
        description: Owns the milestones and the rubric; reports to me.
        model: opus
        backup: codex-sol

      - name: critic
        role: critic
        description: Turns milestones into instructions and reviews every change.
        model: codex-sol
        backup: sonnet

      - name: worker
        role: worker
        description: Does the work in the repository.
        model: sonnet
        backup: qwen-max
        fresh_session: compact
