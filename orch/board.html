<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orch Board</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;
 --page:#f9f9f7;--surface:#fcfcfb;--panel:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;
 --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--code:#f2f1ed;
 --s1:#2a78d6;--s1-wash:#e6f0fc;
 --good:#0ca30c;--good-ink:#006300;--good-bg:#e4f4e4;--warn:#fab219;--warn-ink:#7a5400;--warn-bg:#fff3d6;
 --crit:#d03b3b;--crit-ink:#a32121;--crit-bg:#fbe6e6;--you:#6250d6;--you-bg:#eeebfb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--panel:#161615;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;
 --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--code:#22221f;
 --s1:#3987e5;--s1-wash:#15263c;
 --good:#0ca30c;--good-ink:#0ca30c;--good-bg:#132a13;--warn:#fab219;--warn-ink:#fab219;--warn-bg:#33270c;
 --crit:#d03b3b;--crit-ink:#ff8a8a;--crit-bg:#3a1717;--you:#9085e9;--you-bg:#24203f}}
:root[data-theme="dark"]{color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--panel:#161615;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;
 --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--code:#22221f;
 --s1:#3987e5;--s1-wash:#15263c;
 --good:#0ca30c;--good-ink:#0ca30c;--good-bg:#132a13;--warn:#fab219;--warn-ink:#fab219;--warn-bg:#33270c;
 --crit:#d03b3b;--crit-ink:#ff8a8a;--crit-bg:#3a1717;--you:#9085e9;--you-bg:#24203f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
h1{font-size:19px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:0 0 10px}
.mute{color:var(--mute)}.ink2{color:var(--ink2)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.grid{display:block}
.card{background:var(--panel);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;margin-bottom:16px}
/* the talk panel is a floating window over the middle of the page */
.side{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.38)}
.grid.nochat .side{display:none}
.side .chat{width:min(980px,100%);height:min(86vh,960px);max-width:100%;max-height:100%;margin:0;resize:both;overflow:hidden;
 background:var(--page);box-shadow:0 18px 60px rgba(0,0,0,.35);padding:16px 20px}
.chat-x{margin-left:auto;padding:0 8px;line-height:22px;font-size:16px}
.chat-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.chat-top h2{margin:0}
#chattoggle.on{background:var(--you-bg);border-color:var(--you);color:var(--you)}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:var(--you);color:#fff;font-size:11px;line-height:16px;text-align:center;margin-left:4px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--code);color:var(--ink2)}
.p-good{background:var(--good-bg);color:var(--good-ink)}.p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-crit{background:var(--crit-bg);color:var(--crit-ink)}.p-run{background:var(--s1-wash);color:var(--s1)}.p-you{background:var(--you-bg);color:var(--you)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--ring);border-radius:12px;padding:10px 14px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}.tile .v{font-size:22px;font-weight:600;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink2)}
.now{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s1);display:inline-block}
.dot.live{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}
button{font:inherit;border-radius:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--axis)}button.pri{background:var(--s1);border-color:var(--s1);color:#fff}
a.btn{display:inline-block;font:inherit;border-radius:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:2px 9px;font-size:12px;text-decoration:none}a.btn:hover{text-decoration:none;filter:brightness(.97)}
button.ok{background:var(--good);border-color:var(--good);color:#fff}button.sm{padding:2px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
textarea,input[type=text]{font:inherit;width:100%;border-radius:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:8px 10px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--s1);outline-offset:-1px}
.needs{border:1.5px solid var(--you);background:linear-gradient(0deg,var(--panel),var(--panel))}
.needs h2{color:var(--you)}
.rec{margin:10px 0 4px;padding:8px 12px;border-left:3px solid var(--you);background:var(--you-bg);border-radius:0 8px 8px 0}
.rec .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--you);font-weight:600;margin-bottom:2px}
.rec .md p:last-child{margin-bottom:0}
.q{border-top:1px solid var(--grid);padding:10px 0}.q:first-child{border-top:0;padding-top:0}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-start;margin-top:8px}.row>textarea,.row>input{flex:1}
/* milestone stepper */
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 170px;border:1px solid var(--ring);border-radius:10px;padding:9px 11px;background:var(--surface);cursor:pointer;min-width:170px}
.step.sel{outline:2px solid var(--s1);outline-offset:-1px}
.step .n{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.step .t{font-weight:600;margin:3px 0 6px;line-height:1.3}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}.bar>i{display:block;height:100%;background:var(--s1);border-radius:3px}
/* critic checklist */
.ck-hist{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--mute);margin:8px 0 10px}
.ck-hist .c{font-family:ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:6px;background:var(--code);color:var(--ink2)}
.ck-hist .c.last{background:var(--s1-wash);color:var(--s1);font-weight:600}
.ck{list-style:none;margin:0;padding:0}.ck li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--grid);font-size:13px;line-height:1.45}
.ck.plan li.cur{font-weight:600}.ck.plan li.open:not(.cur){color:var(--ink2)}.ck.plan{margin-bottom:8px}
.ck li:first-child{border-top:0}.ck .bx{flex:none;width:16px;text-align:center}.ck li.open .bx{color:var(--warn-ink)}.ck li.done .bx{color:var(--good-ink)}
.ck .nt{color:var(--mute)}
details.ckp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.ckp>summary::-webkit-details-marker{display:none}
#audit-card[open]>summary .mute{display:none}
details.ckp>summary h2{margin:0}details.ckp>summary:before{content:"▸";color:var(--mute);font-size:12px}details.ckp[open]>summary:before{content:"▾"}
details.ckp .bar{margin-top:8px}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--ring);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:5}
.tip b{font-size:13px}
details.tbl>summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:6px}
/* messages */
.msg{border:1px solid var(--ring);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.msg .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:4px}
.msg .h b{color:var(--ink)}
.msg.to-human{border-color:var(--you)}
/* folded messages: one line each, click to open */
details.fold{border:1px solid var(--ring);border-radius:10px;margin:6px 0;background:var(--surface)}
details.fold.to-human{border-color:var(--you)}
details.fold>summary{cursor:pointer;list-style:none;padding:7px 12px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);min-width:0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"▸";color:var(--mute)}details.fold[open]>summary:before{content:"▾"}
details.fold>summary b{color:var(--ink)}details.fold>summary>*{flex:none}
details.fold>summary .pv{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:13px}
details.fold[open]>summary .pv{visibility:hidden}
details.fold .fb{padding:0 14px 10px;border-top:1px solid var(--grid)}
.clamp{max-height:240px;overflow:hidden;position:relative}
.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--surface))}
.older{display:flex;gap:14px;align-items:center;justify-content:center;padding:6px 0 2px;font-size:12px;color:var(--mute)}
.more{font-size:12px;color:var(--s1);cursor:pointer;background:none;border:0;padding:2px 0}
.md p{margin:4px 0 8px}.md ul,.md ol{margin:4px 0 8px;padding-left:20px}.md li.cb{list-style:none;margin-left:-16px}
.md h3,.md h4,.md h5,.md h6{font-size:14px;margin:10px 0 4px}
.md pre,pre{background:var(--code);border-radius:8px;padding:9px;white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:420px;overflow:auto}
.md code{background:var(--code);border-radius:4px;padding:0 4px;font-size:12px}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--grid);padding:5px 8px;text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* rounds */
details.round{border:1px solid var(--ring);border-radius:10px;margin:8px 0;background:var(--surface)}
details.round>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.round>summary::-webkit-details-marker{display:none}
details.round>summary:before{content:"▸";color:var(--mute)}details.round[open]>summary:before{content:"▾"}
.rb{padding:0 12px 10px}
.tools{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--mute);margin:4px 0}
/* messages: everything passed between people and agents (conversation, transfer, check-in, warning) */
.mfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mrow{padding:8px 0;border-bottom:1px solid #8883}
.mh{font-size:12px;opacity:.75;margin-bottom:4px}
/* chat */
.qthread{max-height:340px;overflow-y:auto;margin:8px 0;padding:6px 4px 0;border-top:1px solid var(--grid)}
.chat{display:flex;flex-direction:column;height:min(70vh,720px)}
.chatlog{flex:1;overflow-y:auto;padding-right:4px}
.cm{margin:8px 0;max-width:92%}.cm.me{margin-left:auto}
.cm .b{border-radius:12px;padding:8px 11px;background:var(--surface);border:1px solid var(--ring)}
.cm.me .b{background:var(--you-bg);border-color:transparent}
.cm .w{font-size:11px;color:var(--mute);margin:0 4px 2px}
.cm.route .b{border-style:dashed;border-color:var(--you)}
/* a <message> an agent passed on, folded where it was written, with what became of it */
details.route{border:1px dashed var(--you);border-radius:8px;margin:8px 0;padding:0 10px;background:var(--surface)}
details.route>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:6px 0;font-size:12.5px}
details.route>summary::-webkit-details-marker{display:none}
details.route>summary:before{content:"▸";color:var(--mute)}details.route[open]>summary:before{content:"▾"}
details.route .rto{color:var(--you);font-weight:600}
details.route .rs{color:var(--ink2)}details.route .rs.ok{color:var(--good-ink)}details.route .rs.bad{color:var(--crit-ink)}details.route .rs.wait{color:var(--warn-ink)}
details.route .pv{color:var(--mute);flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.route[open] .pv{display:none}
details.route>.md{padding:0 0 8px}
.recv{font-size:12px;color:var(--mute);margin:2px 0 6px}
.rchip{font-size:11.5px;padding:0 6px;border-radius:999px;border:1px solid var(--ring);color:var(--ink2);white-space:nowrap}
.rchip.ok{color:var(--good-ink)}.rchip.wait{color:var(--warn-ink)}.rchip.bad{color:var(--crit-ink);border-color:var(--crit)}
a[data-goto]{color:inherit;text-decoration:underline dotted}
details.fold.flash{outline:2px solid var(--you);outline-offset:2px}
.cm.route .w{color:var(--you)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
/* B9b timeline: milestone → step → one block per level of communication → one line per message */
.nowl{font-size:13px;line-height:1.6}.nowl .bad{color:var(--you)}
.stats{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tlbar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tlbar input[type=search]{flex:1 1 220px;min-width:0;font:inherit;border-radius:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:6px 10px}
.tlbar label{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center;white-space:nowrap}
#sres:empty{display:none}#sres{margin-bottom:12px;border:1px solid var(--s1);border-radius:10px;padding:6px 8px;background:var(--surface)}
.shead{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;margin:2px 4px 6px}
.snip{font-size:12px;color:var(--mute);margin:0 0 4px 20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.ms{border:1px solid var(--ring);border-radius:12px;margin:10px 0;background:var(--panel)}
details.ms>summary,details.stp>summary,details.msinfo>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
details.ms>summary::-webkit-details-marker,details.stp>summary::-webkit-details-marker,details.msinfo>summary::-webkit-details-marker,details.ln>summary::-webkit-details-marker{display:none}
details.ms>summary{padding:10px 14px;font-weight:600}
details.ms>summary:before,details.stp>summary:before,details.msinfo>summary:before{content:"▸";color:var(--mute);font-weight:400}
details.ms[open]>summary:before,details.stp[open]>summary:before,details.msinfo[open]>summary:before{content:"▾"}
details.stp{border-top:1px solid var(--grid)}details.stp>summary{padding:7px 14px;font-size:13px}
details.stp>summary .lab{color:var(--ink2);font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
details.msinfo{border-top:1px solid var(--grid);padding:0 14px}details.msinfo>summary{padding:7px 0;font-size:12.5px;color:var(--ink2)}
.msinfo .mi{padding:0 0 10px}
.bcard{padding:12px 14px}.bcard>h2{display:flex;gap:8px;align-items:center}.bcard.b-user>h2{color:var(--you)}
.bcard.b-mon{padding:8px 14px}.bcard.b-mon>h2{margin-bottom:4px}
.bcard details.stp:first-of-type{border-top:0}.bcard details.stp>summary{padding:7px 2px}.bcard .stb{padding:0 0 8px 14px}
.bcard .lane{font-size:12px;color:var(--ink2);margin:8px 4px 2px;padding-top:4px;border-top:1px dashed var(--grid)}
details.bcard>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}details.bcard>summary::-webkit-details-marker{display:none}
details.bcard>summary h2{margin:0;display:flex;gap:8px;align-items:center}details.bcard.b-user>summary h2{color:var(--you)}
details.bcard>summary:before{content:"▸";color:var(--mute)}details.bcard[open]>summary:before{content:"▾"}details.bcard[open]>summary{margin-bottom:6px}
.bmore{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute);padding:4px 4px 2px}
.sz{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}.sz.big{color:var(--warn-ink)}
.rtag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--mute)}
details.inp{border:1px dashed var(--ring);border-radius:8px;margin:4px 0 8px;padding:0 8px}details.inp>summary{cursor:pointer;font-size:12px;color:var(--ink2);padding:4px 0}
.step .cnt{font-size:11px;color:var(--mute);margin-top:4px}
.blk{border:1px solid var(--ring);border-radius:10px;background:var(--surface);padding:6px 6px 4px;min-width:0}
.blk h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:2px 4px 6px;display:flex;gap:6px;align-items:center}
.blk.b-user h3{color:var(--you)}.blk.b-mon{grid-column:1/-1;padding:3px 6px}.blk.b-mon h3{margin:2px 4px}
.blk .lane{font-size:11px;color:var(--mute);margin:4px 4px 2px}
details.ln{border-radius:6px;margin:1px 0}
details.ln>summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline;padding:3px 4px;font-size:12.5px;min-width:0;border-radius:6px}
details.ln>summary:hover{background:var(--code)}
details.ln>summary>*{flex:none}details.ln>summary b{font-weight:600}
details.ln>summary .pv{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
details.ln.other>summary{font-size:11.5px;color:var(--mute);padding:1px 4px}details.ln.other>summary .pv{color:var(--mute)}
.hide-other details.ln.other{display:none}
details.ln.needs>summary{background:var(--you-bg);box-shadow:inset 3px 0 0 var(--you)}
details.ln.flash{outline:2px solid var(--you);outline-offset:1px}
details.ln .fb{padding:4px 8px 8px 10px;margin:2px 0 6px 6px;border-left:2px solid var(--grid)}
.tm{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}
.ktag{font-size:10px;padding:0 5px;border-radius:4px;background:var(--code);color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.ktag.warning{background:var(--warn-bg);color:var(--warn-ink)}.ktag.question,.ktag.gate{background:var(--you-bg);color:var(--you)}
.st{font-size:11px;color:var(--mute)}.st.delivered,.st.answered{color:var(--good-ink)}.st.sent,.st.open,.st.held,.st.superseded{color:var(--warn-ink)}.st.dropped{color:var(--mute)}
.st.running{color:var(--s1)}.st.failed,.st.error,.st.unseen,.st.unknown,.st.timeout{color:var(--crit-ink)}
.lmore{font-size:12px;color:var(--mute);padding:2px 4px}
@media (max-width:600px){.wrap{padding:12px 16px 40px}.tile .v{font-size:18px}.blocks{padding:6px 6px 8px}details.ln>summary .to{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1 id="title">Orch board</h1>
  <span id="status"></span>
  <span class="mute mono" id="runid"></span>
  <span style="flex:1"></span>
  <select id="mon" style="display:none"></select>
  <a class="sm btn" id="replink" href="report" target="_blank" title="The run's static report (report.html): every turn's input and output, to keep or share">📄 Report</a>
  <button class="sm" id="chattoggle" title="Open the conversation with the manager">💬 Talk<span id="chatbadge"></span></button>
  <button class="sm" id="theme" title="Toggle light/dark">◐</button>
  <button class="sm" id="reviewbtn" title="Ask the manager for a review file: a short Markdown review you can comment in and send back">📝 Review file</button>
  <button class="sm ok" id="discpill" hidden title="A discussion with the manager is open: it sends nothing to the critic until you end it. Click to open the conversation">💬 Discussing</button>
  <button class="sm" id="night" title="Night mode: the manager answers questions and passes gates by itself; its decisions are recorded for you to review">🌙 Night</button>

 <div class="grid" id="grid">
  <main>

<script>
(function(){
const MONS = __MONITORS__;
const qsM = new URLSearchParams(location.search).get('m');
let M = MONS.includes(qsM) ? qsM : MONS[0];
document.getElementById('replink').href = 'report?m=' + encodeURIComponent(M);
let D = null;
const chatOlder = new Map(), chatMoreFlag = new Map(); let chatFirstId = '';  // older chat messages fetched on request
const live = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){ s = esc(s);
  return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
          .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>'); }
const LI = /^\s*([-*+]|\d+[.)])\s+/;
// the tag protocol, shown as labelled blocks: <message to="x">, <question>, <pause>, <checklist>, <verdict> …
function tagsToMd(s){
  const lab = (t) => `\n\n**${t}**\n\n`;
  return String(s||'')
    .replace(/<message\s+to\s*=\s*["']?([^"'>]+?)["']?((?:\s+[\w-]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))*)\s*>/gi,
      (_, w, rest) => lab('→ ' + who(w.trim().replace(/^the\s+/i,'')) + (/urgent\s*=\s*["']?(yes|true|1|now)/i.test(rest||'') ? ' (urgent)' : '')))
    .replace(/<question\s*>/gi, lab('❓ Question')).replace(/<pause\s*>/gi, lab('⏸ Pause'))
    .replace(/<plan\s*>/gi, lab('Plan')).replace(/<checklist\s*>/gi, lab('Checklist'))
    .replace(/<rubric\s*>/gi, lab('Rubric')).replace(/<summary\s*>/gi, lab('Summary'))
    .replace(/<verdict\s*>\s*([^<]*)<\/verdict\s*>/gi, (_, v) => lab('Verdict: ' + v.trim()))
    .replace(/<score\s*>\s*([^<]*)<\/score\s*>/gi, (_, v) => lab('Score: ' + v.trim() + (/\//.test(v) ? '' : '/5')))
    .replace(/<decision\s*>\s*([^<]*)<\/decision\s*>/gi, (_, v) => lab('Decision: ' + v.trim()))
    .replace(/<no-wait\s+pid\s*=\s*["']?(\d+)["']?\s*\/?>/gi, (_, p) => `\n\n*(not waited on: pid ${p})*\n\n`)
    .replace(/<question\s+blocking\s*=\s*["']?no["']?\s*>/gi, lab('❓ Question (the work goes on meanwhile)'))
    .replace(/<\/(message|question|pause|plan|checklist|verdict|score|decision|no-wait|rubric|summary)\s*>/gi, '\n\n');
}
const TAGBLOCK = /<(message|question|pause|plan|checklist|verdict|score|decision|no-wait|preference|rubric|summary)\b[^>]*>[\s\S]*?(<\/\1\s*>|$)/gi;
function md(src){
  const L = tagsToMd(src).replace(/\r/g,'').split('\n'); let h = '', i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^\s*```/.test(l)){ const b=[]; i++; while(i<L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++; h += '<pre>'+esc(b.join('\n'))+'</pre>'; continue; }
    if (/^\s*\|/.test(l)){ const rows=[]; while(i<L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]); h += table(rows); continue; }
    const hm = l.match(/^(#{1,4})\s+(.*)/); if (hm){ const n=hm[1].length+2; h += `<h${n}>${inline(hm[2])}</h${n}>`; i++; continue; }
    if (LI.test(l)){ const r = mdList(L, i); h += r[0]; i = r[1]; continue; }
    if (!l.trim()){ i++; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^(\s*```|\s*\||#{1,4}\s)/.test(L[i]) && !LI.test(L[i])) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    h += '<p>' + p.map(inline).join('<br>') + '</p>';
  }
  return h;
}
// a list, with sub-lists by indentation: "1. point" followed by "   - detail" nests the detail under the point
function mdList(L, i){
  const ind = x => x.match(/^\s*/)[0].replace(/\t/g, '    ').length;
  const base = ind(L[i]), ord = /^\s*\d/.test(L[i]), items = [];
  while (i < L.length && LI.test(L[i]) && ind(L[i]) === base && /^\s*\d/.test(L[i]) === ord){
    let t = L[i].replace(LI, ''), sub = ''; i++;
    while (i < L.length){
      if (!L[i].trim()){  // a blank line ends the item unless more indented content follows
        let j = i; while (j < L.length && !L[j].trim()) j++;
        if (j < L.length && ind(L[j]) > base) { i = j; continue; } break; }
      if (LI.test(L[i])){ if (ind(L[i]) > base){ const r = mdList(L, i); sub += r[0]; i = r[1]; continue; } break; }
      if (ind(L[i]) > base){ t += (sub ? '' : ' ') + L[i++].trim(); continue; }
      break;
    }
    items.push([t, sub]);
  }
  const html = (ord ? '<ol>' : '<ul>') + items.map(([t, sub]) => { const c = t.match(/^\[( |x|X)\]\s*(.*)/);
    return c ? `<li class="cb">${c[1]===' '?'☐':'☑'} ${inline(c[2])}${sub}</li>` : `<li>${inline(t)}${sub}</li>`; }).join('') + (ord ? '</ol>' : '</ul>');
  return [html, i];
}
function table(rows){
  rows = rows.map(r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim()));
  const head = rows[0], body = rows.slice(1).filter(r => !r.every(c => /^:?-{2,}:?$/.test(c) || c===''));
  const num = c => /^[\d.]+(\s*\/\s*\d+)?$/.test(c);
  return '<div class="tw"><table><tr>' + head.map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr>' +
    body.map(r => '<tr>' + r.map(c => `<td${num(c)?' class="num"':''}>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table></div>';
}
const STATUS = {running:['p-run','● running'], awaiting_approval:['p-you','⏸ waiting for you'], waiting_job:['p-run','⏳ waiting for a job'], completed:['p-good','✓ completed'],
  failed:['p-crit','✕ failed'], stopped:['p-warn','■ stopped'], max_rounds_reached:['p-warn','! round limit'], needs_human:['p-you','? needs you'], starting:['p-run','starting']};
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;
const stPill = s => { const x = STATUS[s] || ['', s || '…']; return pill(x[0], x[1]); };
function who(role){
  if (!D) return role; if (role === 'human') return 'you';
  const r = role === 'critic' ? 'verifier' : role;
  const a = (D.agents||[]).filter(x => x.role === r); return a.length ? a.map(x=>x.called).join(' & ') : role;
}
const byName = n => (D.agents||[]).find(a => a.name === n);
const called = n => n === 'human' ? 'you' : ((byName(n)||{}).called || n);
const tm = s => s ? String(s).slice(11,16) : '';
function setHTML(el, html){ if (el._h !== html){ el._h = html; el.innerHTML = html; } }

// The poll asks only for what changed since the payload it holds (SNAP, version VER) and rebuilds the rest;
// D is a fresh copy for render, so SNAP stays exactly what the server sent. One poll at a time.
let SNAP = null, VER = '', loading = false, again = false;
function applyState(j){
  if (!j.ver || !j.keys){ SNAP = j; VER = ''; return true; }  // a server from before deltas: the reply is the full payload
  if (j.base !== undefined && (j.base !== VER || !SNAP)) return false;  // not built on what we hold: start over
  const next = {}, set = j.set || {}, patch = j.patch || {};
  for (const k of j.keys){
    if (k in set) next[k] = set[k];
    else if (k in patch){ const old = SNAP[k] || [], out = [];
      for (const op of patch[k]){ if (Array.isArray(op)){ for (let i = op[0]; i < op[0] + op[1]; i++) out.push(old[i]); } else out.push(op.v); }
      next[k] = out; }
    else next[k] = SNAP[k];
  }
  SNAP = next; VER = j.ver; return true;
}
async function load(){
  if (loading){ again = true; return; }
  loading = true;
  try {
    let j;
    try { const r = await fetch('api/state?m=' + encodeURIComponent(M) + '&since=' + encodeURIComponent(VER), {cache:'no-store'}); j = await r.json(); }
    catch(e){ return; }
    if (!applyState(j)){ VER = ''; SNAP = null; again = true; return; }
    D = structuredClone(SNAP);
  } finally { loading = false; if (again){ again = false; soon(); } }
  for (const k in (D.live||{})){ const L = D.live[k]; if (!live[k] || (live[k].text||'').length < (L.text||'').length) live[k] = {text:L.text||'', tools:L.tools||[]}; }
  render();
  document.querySelectorAll('[data-live]').forEach(x => paintLive(x.dataset.live));
}
let tmr = null; const soon = () => { clearTimeout(tmr); tmr = setTimeout(load, 200); };
function connect(){
  const es = new EventSource('api/events?m=' + encodeURIComponent(M));
  es.addEventListener('state', soon);
  es.addEventListener('live', e => { const ev = JSON.parse(e.data); const L = live[ev.turn] || (live[ev.turn] = {text:'', tools:[]});
    if (ev.k === 'text') L.text += ev.s; else if (ev.k === 'tool') { L.tools.push(ev.s); L.tools = L.tools.slice(-12); }
    else if (ev.k === 'break' && L.text && !L.text.endsWith('\n')) L.text += '\n\n';
    paintLive(ev.turn); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
let raf = {};
function paintLive(t){ if (raf[t]) return; raf[t] = requestAnimationFrame(() => { raf[t] = 0;
  document.querySelectorAll('[data-live="'+t+'"]').forEach(el => { const L = live[t] || {};
    el.innerHTML = (L.tools && L.tools.length ? '<div class="tools">' + L.tools.slice(-4).map(x=>'› '+esc(x)).join('<br>') + '</div>' : '')
      + (L.text ? '<div class="md">' + md(L.text) + '</div>' : '<span class="mute">thinking…</span>'); });
  const cl = $('chatlog'); if (cl && cl._stick) cl.scrollTop = cl.scrollHeight; }); }

function render(){
  if (!D || !D.run_id){ $('title').textContent = 'Orch board · ' + M; setHTML($('status'), stPill('starting')); return; }
  const mg = D.managed || {};
  $('title').textContent = D.monitor; setHTML($('status'), stPill(D.status)); $('runid').textContent = D.run_id;
  document.title = (D.status === 'awaiting_approval' ? '⏸ ' : '') + D.monitor + ' · Orch Board';
  renderNeeds(mg); renderNow(mg); renderTimeline(); renderQs(); renderReviews(mg); renderDecisions(); renderAudit(); renderChat();
  Object.keys(live).forEach(paintLive);
}

const DOING = {plan:'drafting the milestone plan', kickoff:'starting the milestone', brief:'briefing', work:'working',
  verify:'reviewing the changes', answer:'answering a question', amend:'updating the notes', report:'writing the milestone report',
  review:'scoring the milestone', guidance:'passing on guidance', feedback:'reading your feedback', compact:'compacting its session',
  checkin:'sending a quick update', check:'checking on the work', ack:'reading the quick update', incoming:'answering a message that just arrived'};
const mins = since => since ? Math.max(0, Math.round((Date.now() - Date.parse(since)) / 60000)) : 0;
function renderNow(mg){  // the switches, and the status area: only the agents working now, one line each
  const nb = $('night'), want = nightWanted();  // the switch as last set (the run applies it when the current turn ends)
  nb.textContent = want ? '🌙 Night: on' : '🌙 Night: off'; nb.classList.toggle('ok', want);
  const qOpen = (D.questions||[]).some(q => q.status === 'open' && q.to === 'human');  // B9: no switch mid-question
  nb.disabled = qOpen && !(D.night_pending != null && D.night_pending !== !!D.night);
  nb.title = qOpen ? 'A question for you is open: night mode can switch once it is answered' : 'Night mode: the manager answers questions and passes gates by itself; its decisions are recorded for you to review';
  const db = $('discuss'), dw = discussWanted();  // B6: shown as last set, at once
  db.textContent = dw ? '✓ End discussion' : '💬 Discuss'; db.classList.toggle('ok', dw);
  db.title = dw ? (gateTakesDiscussion() ? 'End the discussion, then approve or send back at the gate: the manager sends the critic one message with both'
    : 'End the discussion: the manager sends the critic one message with the new directions')
    : 'Discussion: while it is on, the manager sends nothing to the critic; when you end it, it sends one message with the new directions';
  db.hidden = !(dw || !chatWith || chatWith === mgrName());  // a discussion is with the manager: shown there, or while open
  $('discpill').hidden = !dw;  // on the main page only while a discussion is open, as a reminder
  const rb = $('reviewbtn'); rb.disabled = !!mg.review_req; rb.textContent = mg.review_req ? '📝 Review asked…' : '📝 Review file';
  const lines = [], lined = new Set();
  Object.values(D.status_lines||{}).forEach(x => {  // B5: "Sam: step 3, running 14 min — log active"
    const m = x.since_ts ? Math.max(0, Math.round((Date.now()/1000 - x.since_ts)/60)) : 0, bad = x.status && x.status !== 'ok';
    lined.add(x.agent);
    lines.push(`<div class="${bad ? 'bad' : ''}" title="${esc(x.checked_at ? 'last check ' + x.checked_at : 'no check yet')}"><span class="dot live"></span> <b>${esc(called(x.agent))}</b>: ${x.step ? esc(x.step) + ', ' : ''}${x.kind === 'job' ? 'job running' : 'running'} ${m} min — ${esc(x.summary||'')}</div>`); });
  (D.running||[]).forEach(t => { if (lined.has(t.agent)) return; lined.add(t.agent);
    lines.push(`<div><span class="dot live"></span> <b>${esc(called(t.agent))}</b>: ${esc(DOING[t.purpose]||t.purpose)}, running ${mins(t.started_at)} min</div>`); });
  Object.entries(D.reliability||{}).forEach(([n, x]) => {  // B8: a retry waiting, or a backup in use
    const what = x.state === 'retrying' ? `${esc(x.model)} failed (${esc(x.reason||'error')}); retry ${x.retry}/${x.of} in ${x.wait_s}s`
      : x.state === 'switched' ? `switched to backup ${esc(x.model)} (${esc(x.reason||'error')})`
      : x.state === 'backup' ? `on backup ${esc(x.model)}; ${esc(x.primary||'primary')} again after ${x.until ? new Date(x.until * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : 'the cooldown'}`
      : `${esc(x.model)}: ${esc(x.state)} (${esc(x.reason||'')})`;
    lines.push(`<div class="bad">⏳ <b>${esc(called(n))}</b>: ${what}</div>`); });
  Object.keys(D.terminal||{}).forEach(n => lines.push(`<div class="mute" title="orch holds this agent's turns and routes the messages it writes there">⌨ ${esc(called(n))} is open in a terminal</div>`));
  if (D.stop_reason && D.status === 'stopped') lines.push(`<div class="bad">⛔ ${esc(D.stop_reason)}</div>`);
  if (!lines.length) lines.push(`<div class="mute">${mg.held ? (String(mg.held.why).startsWith('question') ? '⏸ Nobody is working: the work waits for your answer to ' + esc(String(mg.held.why).slice(9)) : '⏸ Nobody is working: the manager\'s next step waits for the discussion to close')
    : D.status === 'awaiting_approval' ? ((mg.gate||{}).kind === 'wait' ? '⏸ Paused until your task is done' : '⏸ Nobody is working: waiting for your OK')
    : D.status === 'waiting_job' ? '⏳ Waiting for the worker\'s job to finish' : 'Nobody is working right now (' + esc(D.status||'') + ')'}</div>`);
  setHTML($('now'), lines.join(''));
  const qs = D.questions||[], mss = mg.milestones||[], done = mss.filter(m=>m.status==='done').length;
  const QA = D.queued_answers || {}, openQ = qs.filter(q => q.status === 'open' && !QA[q.id]), mine = openQ.filter(q => q.to === 'human').length;
  const st = [mss.length ? `Milestones ${done} / ${mss.length}${mss[mg.ms] ? ' · on: ' + esc(mss[mg.ms].title) : ''}` : '',
    `Round ${esc(D.round||0)}`, `${openQ.length} question${openQ.length === 1 ? '' : 's'} open${mine ? ` (<b style="color:var(--you)">${mine} for you</b>)` : ''}`,
    `${D.cost ? '$' + Number(D.cost).toFixed(2) : '$—'} · ${((D.turn_counts||{}).total||0)} turns`
      + (D.cost_estimate ? ` <span title="Claude Code prices every model at its own Claude rates. For turns on another provider's endpoint or a model it does not know, its dollars are a guess.">(incl. ~$${Number(D.cost_estimate).toFixed(2)} estimated ⓘ)</span>` : '')];
  setHTML($('stats'), st.filter(Boolean).map(x => `<span>${x}</span>`).join(''));
}

function qThread(qid){ const rows = {}; (D.chat||[]).filter(c => c.qid === qid).forEach(c => rows[c.id] = Object.assign(rows[c.id]||{}, c)); return Object.values(rows).map(fullC); }
// the state carries chat messages clipped (c.len is the whole length); the whole text loads on request, cached
function fullC(c){ const m = c.len > (c.text||'').length && msgCache.get('c:' + c.id); return m && m.text != null ? Object.assign({}, c, {text: m.text, len: 0}) : c; }
const clipNote = c => c.len > (c.text||'').length ? `<button class="more" data-chatfull="${esc(c.id)}">Show the whole message (${Math.round(c.len/1000)}k characters)</button>` : '';
function renderNeeds(mg){
  const QA = D.queued_answers || {};
  const g = mg.gate, mine = (D.questions||[]).filter(q => q.status === 'open' && q.to === 'human' && !QA[q.id]);  // settled ones leave

  const revs = (D.review_files||[]).filter(r => r.status === 'written' && r.exists);  // B9: a review file to comment in
  const job = mg.job, sig = JSON.stringify([job && job.since, g && g.key, discussWanted(), !!(mg.discussion_batch||{}).gate, mine.map(q => q.id), QA, D.can_chat, Object.values(threads).map(t => t.map(c => c.id + c.status)), revs.map(r => r.path)]);
  const el = $('needs'); if (el._sig === sig) return; el._sig = sig;
  const typed = {}; el.querySelectorAll('textarea,input').forEach(x => { if (x.id) typed[x.id] = x.value; });
  if (!g && !mine.length && !job && !revs.length){ el.innerHTML = ''; return; }
  let h = '<div class="card needs"><h2>' + (g || mine.length || revs.length ? 'Needs you' : 'Waiting for a job') + '</h2>';
  revs.forEach(r => { h += `<div class="q"><div class="row" style="align-items:center;gap:8px;margin-top:0">📝 <b>Review file to comment:</b> ${r.href ? `<a href="${esc(r.href)}" target="_blank">${esc(r.name)}</a>` : esc(r.name)}
      <span style="flex:1"></span><button class="sm" data-rc="${esc(r.path)}" title="Sends what you changed in the file (your comments) to the manager">↩ Send back comments</button></div>
      <div class="mute mono" style="font-size:11px">${esc(r.path)}</div></div>`; });
  if (job){
    const ls = Object.entries(job.agents||{}).map(([a, j]) => `<li><b>${esc(called(a))}</b>: ${inline((j.lines||[]).join('; '))}</li>`).join('');
    h += `<div style="font-weight:600;margin-bottom:4px">⏳ A job the worker started is still running, so the critic's review is held until it ends (since ${tm(job.since)})</div>
      <ul>${ls}</ul><div class="row"><button data-job="1">▶ Review now, don't wait</button></div>`;
  }
  if (g){
    h += `<div style="font-weight:600;margin-bottom:4px">⏸ ${esc(g.title)}</div>`;
    if (g.summary) h += `<div class="rec"><div class="k">What changed, what was checked, where to look</div><div class="md">${md(g.summary)}</div></div>`;
    if (g.kind === 'plan'){
      h += '<div class="tw"><table><tr><th>#</th><th>milestone</th><th>done when</th></tr>' + (mg.milestones||[]).map((m,i) =>
        `<tr><td class="num">${i+1}</td><td><b>${inline(m.title)}</b></td><td>${inline(m.done_when||'')}</td></tr>`).join('') + '</table></div>';
      h += `<details class="tbl"><summary>The manager's full plan and rubric</summary><div class="md">${md(g.text)}</div></details>`;
    } else {
      h += `<div class="md">${md(g.text)}</div>`;
    }

function mgrName(){ const m = (D.agents||[]).find(a => a.role === 'manager'); return m ? m.name : 'manager'; }
let chatWith = null;  // the agent name being talked to; null = the manager
function talkable(){ return (D.agents||[]).filter(a => ['manager','verifier','worker'].includes(a.role)); }
function renderChat(){
  const cl = $('chatlog'), atBottom = cl.scrollHeight - cl.scrollTop - cl.clientHeight < 40;
  const mg = mgrName(), sel = $('chatwho'), opts = talkable();
  if (!chatWith || !opts.some(a => a.name === chatWith)) chatWith = mg;
  const optHtml = opts.map(a => `<option value="${esc(a.name)}"${a.name === chatWith ? ' selected' : ''}>${esc(a.called)} (${esc(a.role === 'verifier' ? 'critic' : a.role)})</option>`).join('');
  if (sel._h !== optHtml){ sel._h = optHtml; sel.innerHTML = optHtml; }
  const who2 = called(chatWith);
  $('chat-h').textContent = 'Talk to ' + who2;
  $('chat-hint').textContent = !D.can_chat ? 'Chat needs `orch serve <config>` or `orch run --serve`.'
    : chatWith === mg ? "Goes to " + who2 + "'s own conversation."
    : "Goes to " + who2 + "'s own conversation. It answers when its current turn ends; its replies are not passed on.";
  $('chatsend').disabled = !D.can_chat;
  const merged = new Map();  // older messages fetched on request first, then the latest ones from the state
  for (const c of [...(chatOlder.get(chatWith)||[]), ...(D.chat||[]).filter(c => !c.qid && (c.with || mg) === chatWith)])
    merged.set(c.id, Object.assign(merged.get(c.id)||{}, c));
  const list = [...merged.values()].map(fullC);
  chatFirstId = list.length ? list[0].id : '';
  const moreFlag = chatMoreFlag.has(chatWith) ? chatMoreFlag.get(chatWith) : !!(D.chat_more||{})[chatWith];
  const olderBtn = moreFlag ? '<div class="older"><button class="more" data-chatmore="1">Show older messages</button></div>' : '';
  const h = list.length ? list.map(c => c.role === 'human'
      ? `<div class="cm me"><div class="w" style="text-align:right">you · ${tm(c.ts)}</div><div class="b">${md(c.text)}${clipNote(c)}</div></div>`
      : replyBubbles(c, called(c.who || c.with || mg), '', problemLine(c) + relayLine(c.id))).join('')
    : (chatWith === mg
      ? `<div class="empty">Ask ${esc(who2)} how things stand, why a milestone was sent back, or tell them what to prioritise. If they want ${esc(who('critic'))} to change course, they will say so and it is passed on.</div>`
      : `<div class="empty">Talk to ${esc(who2)} directly: a question, a clarification, or a change of approach. Its reply appears here.</div>`);
  seenReplies(list.filter(c => c.role !== 'human' && c.status !== 'running').length);
  setHTML(cl, olderBtn + h); cl._stick = atBottom || cl._first === undefined; cl._first = 1; if (cl._stick) cl.scrollTop = cl.scrollHeight;
}
function routedBlocks(text){  // a reply split into what it says to you and each <message to="…"> block it passes on
  const blocks = [], re = /<message\b([^>]*)>([\s\S]*?)(?:<\/message\s*>|$)/gi;
  const plain = String(text||'').replace(re, (_, attrs, body) => {
    const t = attrs.match(/\bto\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+))/i) || [];
    const to = (t[1] ?? t[2] ?? t[3] ?? '').trim();
    blocks.push({to: to.replace(/^the\s+/i, ''), urgent: /urgent\s*=\s*["']?(yes|true|1|now)/i.test(attrs), body: body.trim()});
    return '\n';
  });
  return {plain: plain.trim(), blocks};
}
const openRoutes = new Set();  // cards opened by hand, kept open across refreshes
function routeStatus(r){  // what became of one passed-on message, as a line of HTML ('' when orch has no record)
  if (!r || !r.status) return ['', ''];
  const to = esc(called(r.to)), link = id => `<a href="#" data-goto="${esc(id)}">${esc(id)}</a>`;
  switch (r.status){
    case 'you': return ['ok', 'for you'];
    case 'read': return ['ok', `✓ read in ${link(r.turn)}${r.purpose ? ' (' + esc(r.purpose) + ')' : ''}`
      + (r.how === 'cut in' ? ', cut into the running turn' : r.how === 'live' ? ', sent into the running turn' : '')
      + (r.turn_status === 'running' ? ', running now' : '') + (r.at ? ' · ' + tm(r.at) : '')];
    case 'waiting': return ['wait', r.urgent ? `⚡ waiting: urgent, cuts into ${to}'s running turn` : `⏳ waiting for ${to}'s next turn`];
    case 'unseen': return ['bad', `? not found in the prompts of ${to}'s ${r.later} later turn${r.later === 1 ? '' : 's'}`];
    case 'superseded': return ['wait', `↷ superseded: ${esc(r.reason || 'a later message replaced it')}${r.turn ? ' (' + link(r.turn) + ')' : ''}`];
    case 'dropped': return ['', `⊘ dropped: ${esc(r.reason || 'nothing will carry it any more')}`];
    case 'held': return [r.by_design ? 'ok' : 'wait', `${r.by_design ? '⊘' : '⏸'} held: ${esc(r.reason || '')}`];
    case 'unknown': return ['bad', `⚠ sent into ${to}'s running turn${r.turn ? ' ' + link(r.turn) : ''}, not confirmed`];
    case 'failed': return ['bad', `⚠ not delivered: ${esc(r.problem || '')}`];
  }
  return ['', esc(r.status)];
}
function chatRoutes(id, rows){  // a chat reply's passed-on messages, from the inbox notes they became
  return (rows || (D.relays||{})[id] || []).map(r => r.status === 'delivered'
    ? Object.assign({}, r, {status: r.turn ? 'read' : 'waiting'}) : r);
}
function routeCards(text, rows, src){  // each <message> a reply passed on, as a folded card with its status
  const complete = true, blocks = routedBlocks(text).blocks;
  const byI = new Map((rows||[]).map((r, k) => [r.i ?? k, r]));
  const n = complete ? blocks.length : (rows||[]).length;
  let h = '';
  for (let i = 0; i < n; i++){
    const b = complete ? blocks[i] : null, r = complete ? byI.get(i) : rows[i];
    const rawTo = b ? b.to : (r.to || ''), you = (r && r.status === 'you') || (!r && /^you$/i.test(rawTo));
    const key = src + ':' + i, [cls, st] = you ? ['ok', 'for you'] : routeStatus(r);
    const name = you ? 'you' : (r && r.to ? called(r.to) : who(rawTo));
    const urgent = b ? b.urgent : !!(r && r.urgent);
    const body = b ? md(b.body) : `<div class="mute" data-loadturn="${esc(src)}">Loading the message…</div>`;
    h += `<details class="route" data-route="${esc(key)}" data-src="${esc(src)}"${(you && b) || openRoutes.has(key) ? ' open' : ''}><summary>`
      + `<span class="rto">→ to ${esc(name)}${urgent ? ' (urgent)' : ''}</span>`
      + (st ? `<span class="rs ${cls}">${st}</span>` : '')
      + `<span class="pv">${esc(b ? preview(b.body) : (r.preview || ''))}</span></summary><div class="md">${body}</div></details>`;
  }
  return h;
}
function routedHTML(text, rows, src){  // a whole reply: its own text, then the cards
  const {plain, blocks} = routedBlocks(text);
  return blocks.length ? md(plain) + routeCards(text, rows, src) : md(text || '(empty)');
}
function heldLine(hs){  // blocks of this reply orch keeps from the next agent by design: logged, not lost
  if (!hs || !hs.length) return '';
  const kinds = [...new Set(hs.map(h => h.kind))];
  return `<div class="recv" title="${esc(hs.map(h => h.reason).join('; '))}">⊘ Held by design from ${esc(called(hs[0].to))}: ${esc(kinds.join(', '))}</div>`;
}
function receivedLine(rs){  // on the recipient's side: which earlier messages this turn's prompt carries
  if (!rs || !rs.length) return '';
  return `<div class="recv">↳ Its prompt carried ${rs.map(x => `the message from ${esc(called(x.from))} in <a href="#" data-goto="${esc(x.turn)}">${esc(x.turn)}</a>`).join(', ')}</div>`;
}
document.addEventListener('toggle', e => { const d = e.target; if (!d.dataset || !d.dataset.route) return;
  d.open ? openRoutes.add(d.dataset.route) : openRoutes.delete(d.dataset.route); }, true);
document.addEventListener('click', e => {  // jump to a turn's reply: open its milestone and step, unfold it, show it
  const a = e.target.closest('a[data-goto]'); if (!a) return; e.preventDefault(); gotoItem('t:' + a.dataset.goto); });
function replyBubbles(c, name, note, tail){  // one agent reply: its own text, then each message it sent on, as separate bubbles
  const head = `${esc(name)} · ${tm(c.ts)}${note || ''}${c.status && c.status!=='ok' && c.status!=='running' ? ' · ' + esc(c.status) : ''}`;
  if (c.status === 'running') return `<div class="cm"><div class="w">${head}</div><div class="b"><div data-live="${esc(c.id)}"></div></div></div>`;
  const {plain, blocks} = routedBlocks(c.text);
  let h = '';
  if (plain || !blocks.length) h += `<div class="cm"><div class="w">${head}</div><div class="b">${md(plain || c.text || '')}${clipNote(c)}</div></div>`;
  for (const b of blocks)
    h += `<div class="cm route"><div class="w">${plain || blocks.indexOf(b) ? '' : head + ' · '}→ to ${esc(who(b.to))}${b.urgent ? ' (urgent)' : ''}</div><div class="b">${md(b.body)}</div></div>`;
  return h + (tail ? `<div class="cm">${tail}</div>` : '');
}
function problemLine(c){  // <message> blocks in this reply that orch could not send
  return (c.problems||[]).map(p => `<div class="w" style="color:#b45309">⚠ ${esc(p)}</div>`).join('');
}
function relayLine(id){  // what became of the messages this reply passed on
  const rs = (D.relays||{})[id]; if (!rs || !rs.length) return '';
  return rs.map(r => {
    const a = (D.agents||[]).find(x => x.name === r.to), to = esc(a ? a.called : who(r.to || 'critic'));
    const s = r.status === 'delivered'
      ? `✓ passed to ${to}${r.at ? ' at ' + tm(r.at) : ''}${r.turn ? ` · read in ${esc(r.turn)} (${esc(r.purpose || '')}${r.turn_status === 'running' ? ', running now' : ''})` : ''}`
      : r.status === 'held' ? `⏸ held for ${to}: ${esc(r.reason || '')}`
      : r.status === 'superseded' ? `↷ superseded: ${esc(r.reason || 'a later message replaced it')}`
      : r.status === 'dropped' ? `⊘ dropped: ${esc(r.reason || 'nothing will carry it any more')}`
      : (r.urgent ? `⚡ waiting for ${to}: urgent delivery` : `⏳ waiting for ${to}: it is answered as soon as it is idle`);
    return `<div class="w">${s}</div>`; }).join('');
}
async function sendChat(){ const ta = $('chatin'), m = ta.value.trim(); if (!m || !D || !D.can_chat) return; ta.value = ''; $('chatlog')._stick = true;
  const body = {message: m}; if (chatWith && chatWith !== mgrName()) body.agent = chatWith; await post('api/chat', body); }
$('chatwho').addEventListener('change', e => { chatWith = e.target.value; const cl = $('chatlog'); cl._first = undefined; render(); });
// keep the stick-to-bottom flag in step with where the reader actually is, so streamed replies
// don't pull the list down while the reader is scrolled up (e.g. selecting text above)
$('chatlog').addEventListener('scroll', e => { const cl = e.currentTarget;
  cl._stick = cl.scrollHeight - cl.scrollTop - cl.clientHeight < 40; });
$('chatlog').addEventListener('click', async e => { const b = e.target.closest('[data-chatmore]'); if (!b) return; b.disabled = true;
  try { const r = await fetch('api/chat?m=' + encodeURIComponent(M) + '&with=' + encodeURIComponent(chatWith) + '&before=' + encodeURIComponent(chatFirstId), {cache:'no-store'});
        const j = await r.json(); chatOlder.set(chatWith, [...(j.rows||[]), ...(chatOlder.get(chatWith)||[])]); chatMoreFlag.set(chatWith, !!j.more); }
  catch(err){ b.disabled = false; return; }
  render(); });
let chatOpen, replies = 0, seen = null;
function seenReplies(n){ replies = n; if (seen === null || chatOpen) seen = n; badge(); }  // replies already there on load count as read
function badge(){ const k = seen === null ? 0 : replies - seen; $('chatbadge').innerHTML = !chatOpen && k > 0 ? `<span class="badge">${k}</span>` : ''; }
function setChat(open){ chatOpen = open; $('grid').classList.toggle('nochat', !open); $('chattoggle').classList.toggle('on', open);
  document.body.style.overflow = open ? 'hidden' : '';
  if (open){ if (seen !== null) seen = replies; const cl = $('chatlog'); cl.scrollTop = cl.scrollHeight; setTimeout(() => $('chatin').focus(), 0); }
  badge(); }
setChat(location.hash === '#talk');
$('chattoggle').addEventListener('click', () => setChat(!chatOpen));
$('discpill').addEventListener('click', () => { if (chatWith && chatWith !== mgrName()){ chatWith = null; const cl = $('chatlog'); cl._first = undefined; } setChat(true); render(); });
$('chatclose').addEventListener('click', () => setChat(false));
document.querySelector('.side').addEventListener('mousedown', e => { if (e.target === e.currentTarget) setChat(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && chatOpen) setChat(false); });
$('chatsend').addEventListener('click', sendChat);
$('chatin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(); } });
function nightWanted(){ return D.night_pending == null ? !!D.night : !!D.night_pending; }
function discussWanted(){ return D.discussion_pending == null ? !!D.discussion : !!D.discussion_pending; }
// a plan or milestone gate open: a discussion ended there waits for my decision, then goes in one message with it
function gateTakesDiscussion(){ const g = (D.managed||{}).gate; return !!g && (g.kind === 'plan' || g.kind === 'milestone'); }
$('discuss').addEventListener('click', async () => { const on = !discussWanted(), atGate = gateTakesDiscussion();
  if (!confirm(on ? 'Start a discussion? The manager sends nothing to the critic until you end it; then it sends one message with the new directions.'
      : atGate ? 'End the discussion? Nothing is sent yet: next, approve or send back at the gate, and the manager sends the critic one message with the discussion and your decision.'
      : 'End the discussion? The manager sends the critic one message with the new directions.')) return;
  D.discussion_pending = on; render(); await post('api/discussion', {on});
  if (!on && atGate){ setChat(false); const n = $('needs'); if (n) n.scrollIntoView({behavior: 'smooth', block: 'start'});
    setTimeout(() => { const t = $('gate-msg'); if (t) t.focus(); }, 300); } });
$('reviewbtn').addEventListener('click', async () => { if (!confirm('Ask the manager for a review file you can comment in?')) return;
  $('reviewbtn').disabled = true; await post('api/review', {}); });
$('night').addEventListener('click', () => { const on = !nightWanted();
  if (confirm(on ? 'Turn night mode on? The manager answers your questions and passes gates itself until you turn it off; its choices are recorded in Questions and Decisions.' : 'Turn night mode off?')) post('api/night', {on}); });
$('stop').addEventListener('click', () => { if (confirm('Stop the run after the current turn? You can resume it later.')) post('api/stop', {}); });
$('theme').addEventListener('click', () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('orch-theme', r.dataset.theme); } catch(e){} });
try { const t = localStorage.getItem('orch-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
if (MONS.length > 1){ const s = $('mon'); s.style.display = ''; s.innerHTML = MONS.map(m => `<option${m===M?' selected':''}>${esc(m)}</option>`).join('');
  s.addEventListener('change', () => { location.search = '?m=' + encodeURIComponent(s.value); }); }
load(); connect(); setInterval(load, 30000);
})();
